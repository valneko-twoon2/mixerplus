[package]
name = "mixerplus"
version = "1.0.2"
edition = "2024"
description = "A compact Windows tray volume mixer"
license = "MIT"

[[bin]]
name = "mixerplus"
path = "main.rs"

[dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = ["Foundation", "Media_Audio", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_Debug", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_SystemInformation", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_Devices_FunctionDiscovery", "Win32_Security"] }

[profile.release]
debug = 0
incremental = false
lto = true
codegen-units = 1
strip = true

[profile.dev]
debug = 0
incremental = false
strip = "debuginfo"

[profile.test]
debug = 0
incremental = false
strip = "debuginfo"
